name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main_ci.yml"
      - ".github/workflows/release.yml"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "conanfile.py"
      - "vcpkg.json"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test-vcpkg:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - debug
          - release
        runtime:
          - all
          - flatrim
          - ae
          - se
          - vr
        compiler:
          - msvc
          - clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # If we don't have this setting on our local PC, we will get an error during the cloning process.
      - name: Increase buffer capacity for clone
        run: git config --global http.postBuffer 524288000
      # NOTE: Manual for speed emphasis as it is not certain if the checkout does shallow cloning.
      # https://github.com/actions/checkout/blob/main/src/git-source-provider.ts#L244
      - name: Clone openvr
        run: git submodule update --init --depth=1

      # Install latest CMake and Ninja.
      - uses: lukka/get-cmake@latest
        with:
          # This designation is important.
          # 3.31.5: ver. policy error
          # 3.19.8: Error with missing src dir or deps lib (e.g. spdlog)
          cmakeVersion: 3.22

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # vcpkgGitCommitId calculation code is made available under the MIT License
      # ref: https://github.com/mehah/otclient/actions/runs/13703854793/workflow#L42
      - name: Restore artifacts and install vcpkg
        id: vcpkg-step
        run: |
          $json=Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $vcpkgCommitId=$json.'builtin-baseline'
          Write-Host "vcpkg commit ID: $vcpkgCommitId"
          echo "vcpkgGitCommitId=$vcpkgCommitId" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}
          doNotCache: true

      - name: Build
        uses: lukka/run-cmake@v10.8
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/CMakeLists.txt
          configurePreset: build-${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
          buildPreset: ${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
        continue-on-error: true

      - name: Install
        run: cmake --install build/${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }} --prefix ./build/${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}/x64-windows-static-md
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
          path: ${{ github.workspace }}/build/${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}/

      # - name: Release
      #   uses: ncipollo/release-action@v1.14.0
      #   with:
      #     allowUpdates: true
      #     artifacts: |
